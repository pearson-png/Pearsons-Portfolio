/* from Google AI overview */
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrolling Navigation Bar</title>
  <style>
    /* Smooth scrolling across the page */
    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }

    /* Sticky navigation bar */
    nav {
      position: sticky;
      top: 0;
      background-color: #1e293b;
      padding: 1rem;
      display: flex;
      justify-content: center;
      gap: 2rem;
      z-index: 1000;
    }

    nav a {
      color: #f8fafc;
      text-decoration: none;
      font-weight: 500;
      padding: 0.25rem 0.5rem;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
    }

    nav a:hover,
    nav a.active {
      border-bottom-color: #38bdf8;
      color: #38bdf8;
    }

    /* Page sections */
    section {
      height: 100vh;
      padding: 4rem 2rem;
      scroll-margin-top: 3.5rem; /* Prevents navbar from covering section headings */
    }

    #home { background: #f1f5f9; }
    #about { background: #e2e8f0; }
    #services { background: #cbd5e1; }
    #contact { background: #94a3b8; }
  </style>
</head>
<body>

  <nav>
    <a href="#home" class="active">Home</a>
    <a href="#about">About</a>
    <a href="#services">Services</a>
    <a href="#contact">Contact</a>
  </nav>

  <section id="home"><h1>Home</h1></section>
  <section id="about"><h1>About</h1></section>
  <section id="services"><h1>Services</h1></section>
  <section id="contact"><h1>Contact</h1></section>

</body>
</html>
